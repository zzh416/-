name: bagu

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bagu}
      POSTGRES_USER: ${POSTGRES_USER:-bagu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bagu}
    # 如需从宿主机用数据库工具连接，取消下面注释并改为空闲端口，例如 "5433:5432"
    # ports:
    #   - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bagu} -d ${POSTGRES_DB:-bagu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # 如需从宿主机连接，取消下面注释并改为空闲端口，例如 "6380:6379"
    # ports:
    #   - "6380:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  renderer:
    build:
      context: ../services/renderer
      args:
        BASE_IMAGE: ${RENDERER_BASE_IMAGE:-mcr.microsoft.com/playwright:v1.64.0-noble}
    init: true
    user: pwuser
    read_only: true
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 512mb
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "9100"
    networks:
      - renderer_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      args:
        BASE_IMAGE: ${API_BASE_IMAGE:-python:3.12-slim}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 9000 --no-access-log"
    init: true
    user: appuser
    read_only: true
    environment:
      ENVIRONMENT: production
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bagu}
      POSTGRES_USER: ${POSTGRES_USER:-bagu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bagu}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      TEXT_MODEL_PROVIDER: ${TEXT_MODEL_PROVIDER:-glm}
      OCR_PROVIDER: ${OCR_PROVIDER:-glm}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_TEXT_MODEL: ${GLM_TEXT_MODEL:-glm-4-plus}
      GLM_OCR_MODEL: ${GLM_OCR_MODEL:-glm-ocr}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TEXT_MODEL: ${DEEPSEEK_TEXT_MODEL:-deepseek-chat}
      DEEPSEEK_OCR_MODEL: ${DEEPSEEK_OCR_MODEL:-deepseek-flash}
      DEEPSEEK_OCR_MAX_OUTPUT_TOKENS: ${DEEPSEEK_OCR_MAX_OUTPUT_TOKENS:-8192}
      AI_ANSWER_DAILY_LIMIT: ${AI_ANSWER_DAILY_LIMIT:-30}
      AI_ANSWER_CONCURRENCY_LIMIT: ${AI_ANSWER_CONCURRENCY_LIMIT:-1}
      AI_ANSWER_RETRY_LIMIT: ${AI_ANSWER_RETRY_LIMIT:-3}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - ../data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/v1/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../backend
      args:
        BASE_IMAGE: ${API_BASE_IMAGE:-python:3.12-slim}
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    init: true
    user: appuser
    read_only: true
    environment:
      ENVIRONMENT: production
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bagu}
      POSTGRES_USER: ${POSTGRES_USER:-bagu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bagu}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      TEXT_MODEL_PROVIDER: ${TEXT_MODEL_PROVIDER:-glm}
      OCR_PROVIDER: ${OCR_PROVIDER:-glm}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_TEXT_MODEL: ${GLM_TEXT_MODEL:-glm-4-plus}
      GLM_OCR_MODEL: ${GLM_OCR_MODEL:-glm-ocr}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TEXT_MODEL: ${DEEPSEEK_TEXT_MODEL:-deepseek-chat}
      DEEPSEEK_OCR_MODEL: ${DEEPSEEK_OCR_MODEL:-deepseek-flash}
      DEEPSEEK_OCR_MAX_OUTPUT_TOKENS: ${DEEPSEEK_OCR_MAX_OUTPUT_TOKENS:-8192}
      AI_ANSWER_DAILY_LIMIT: ${AI_ANSWER_DAILY_LIMIT:-30}
      AI_ANSWER_CONCURRENCY_LIMIT: ${AI_ANSWER_CONCURRENCY_LIMIT:-1}
      AI_ANSWER_RETRY_LIMIT: ${AI_ANSWER_RETRY_LIMIT:-3}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      RENDERER_URL: http://renderer:9100
      RENDERER_TIMEOUT_SECONDS: ${RENDERER_TIMEOUT_SECONDS:-30}
    volumes:
      - ../data:/data
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      renderer:
        condition: service_healthy
    networks:
      - default
      - renderer_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'celery -A app.workers.celery_app inspect ping --destination "celery@$$HOSTNAME" --timeout 5 | grep -q pong',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ../frontend
      target: runtime
      args:
        BASE_IMAGE: ${WEB_BASE_IMAGE:-node:24-alpine}
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://api:9000}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:

networks:
  renderer_net:
