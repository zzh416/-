services:
  api:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload"
    volumes:
      - ../backend:/app
      - ../data:/data

  worker:
    volumes:
      - ../backend:/app
      - ../data:/data

  web:
    build:
      target: development
    command: npm run dev -- --host
    volumes:
      - ../frontend:/app
      - /app/node_modules
